name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Application
        run: npm run build

      - name: Prepare Clean Server Host
        id: ftp-host
        run: |
          RAW_SERVER="${{ secrets.HOSTINGER_FTP_SERVER }}"
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[^/]*//||' -e 's|/.*$||' -e 's|:.*$||' | tr -d ' ')
          echo "server=$CLEAN_SERVER" >> $GITHUB_OUTPUT

      - name: Verify Generated Static Files
        run: |
          echo "Listing .output/public:"
          ls -la .output/public/
          test -f .output/public/index.html && echo "index.html exists!" || exit 1
          # Also ensure public/ has the static files for backup
          cp -r .output/public/. public/ 2>/dev/null || true

      - name: Sync to Hostinger Root via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp-host.outputs.server }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          local-dir: .output/public/
          server-dir: ./
          dangerous-clean-slate: false

      - name: Also Sync to public_html/ (if FTP root is one level above public_html)
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp-host.outputs.server }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          local-dir: .output/public/
          server-dir: public_html/
          dangerous-clean-slate: false
