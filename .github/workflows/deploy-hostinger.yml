name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Application
        run: npm run build

      - name: Prepare Clean Server Host
        id: ftp-host
        run: |
          RAW_SERVER="${{ secrets.HOSTINGER_FTP_SERVER }}"
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[^/]*//||' -e 's|/.*$||' -e 's|:.*$||' | tr -d ' ')
          echo "server=$CLEAN_SERVER" >> $GITHUB_OUTPUT

      - name: Prepare Deploy Bundles
        run: |
          echo "Verifying generated build artifacts..."
          test -f .output/public/index.html && echo "index.html exists in .output/public!" || exit 1
          
          # Create an explicit deployment package matching Hostinger's structure
          mkdir -p /tmp/hostinger-deploy
          cp -r .output/public/* /tmp/hostinger-deploy/
          cp -r .output/public/.* /tmp/hostinger-deploy/ 2>/dev/null || true

          # Also create a nested public/ folder inside the deploy package
          # in case Hostinger is configured with document root public_html/public
          mkdir -p /tmp/hostinger-deploy/public
          cp -r .output/public/* /tmp/hostinger-deploy/public/
          cp -r .output/public/.* /tmp/hostinger-deploy/public/ 2>/dev/null || true

          echo "Deployment package prepared successfully."
          ls -la /tmp/hostinger-deploy/

      # Case A: If FTP user opens directly inside public_html
      - name: Deploy to FTP Root (./)
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp-host.outputs.server }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          local-dir: /tmp/hostinger-deploy/
          server-dir: ./
          dangerous-clean-slate: false

      # Case B: If FTP user opens above public_html
      - name: Deploy to public_html/
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp-host.outputs.server }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          local-dir: /tmp/hostinger-deploy/
          server-dir: public_html/
          dangerous-clean-slate: false

      # Case C: If Hostinger points document root to public_html/public/
      - name: Deploy to public_html/public/
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp-host.outputs.server }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          local-dir: .output/public/
          server-dir: public_html/public/
          dangerous-clean-slate: false
